<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="flagShape">
      <path d="M318 96 C352 82 380 112 414 98 C430 92 442 86 452 82 L452 208 C442 212 430 218 414 224 C380 238 352 208 318 222 Z"/>
    </clipPath>
    <radialGradient id="bodyShade" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#ffd84d"/>
      <stop offset="1" stop-color="#f4b416"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="0" fill="#ebe3fc"/>
  <circle cx="200" cy="330" r="190" fill="#dccff8"/>

  <g transform="translate(26,6)">
  <!-- flag pole -->
  <rect x="306" y="84" width="14" height="300" rx="7" fill="#3a2a1f"/>
  <circle cx="313" cy="82" r="11" fill="#e8c46a"/>

  <!-- flag: green, white, red -->
  <g clip-path="url(#flagShape)">
    <rect x="318" y="60" width="46" height="190" fill="#1f9d55"/>
    <rect x="364" y="60" width="44" height="190" fill="#ffffff"/>
    <rect x="408" y="60" width="50" height="190" fill="#d7263d"/>
  </g>
  <path d="M318 96 C352 82 380 112 414 98 C430 92 442 86 452 82 L452 208 C442 212 430 218 414 224 C380 238 352 208 318 222 Z" fill="none" stroke="#2d2742" stroke-opacity=".3" stroke-width="3"/>
  </g>

  <!-- feet -->
  <path d="M150 432 q-26 4 -40 22 q22 -2 30 4 q8 -10 26 -10 z" fill="#f28c28"/>
  <path d="M232 436 q-24 6 -34 24 q20 -4 28 2 q8 -10 26 -12 z" fill="#f28c28"/>

  <!-- body -->
  <ellipse cx="200" cy="350" rx="128" ry="98" fill="url(#bodyShade)"/>
  <!-- tail -->
  <path d="M78 330 q-26 -30 -8 -64 q20 26 44 34 z" fill="#f4b416"/>

  <!-- head -->
  <circle cx="200" cy="200" r="96" fill="url(#bodyShade)"/>
  <!-- cheek -->
  <ellipse cx="236" cy="238" rx="18" ry="11" fill="#ff9f6b" opacity=".55"/>
  <!-- eye -->
  <circle cx="226" cy="178" r="13" fill="#14202e"/>
  <circle cx="231" cy="173" r="4.5" fill="#ffffff"/>
  <!-- beak, smiling -->
  <path d="M262 206 q44 -6 62 12 q-10 30 -58 26 q-18 -2 -22 -14 z" fill="#f28c28"/>
  <path d="M266 230 q30 8 54 -8" fill="none" stroke="#c2621a" stroke-width="5" stroke-linecap="round"/>

  <!-- wing holding the pole -->
  <path d="M190 330 q52 -58 138 -40 q22 6 20 24 q-2 18 -24 20 q-74 4 -100 34 q-26 -6 -22 -38 z" fill="#f4b416"/>
  <ellipse cx="338" cy="306" rx="20" ry="17" fill="#f4b416"/>
  <path d="M322 296 q16 -4 30 4" fill="none" stroke="#d99a0c" stroke-width="4" stroke-linecap="round"/>
</svg>
